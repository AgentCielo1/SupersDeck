name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Prisma 7's @prisma/client is a stub until generation runs; the
        # build script generates for itself, but type-check runs first.
        # prisma.config.ts requires DIRECT_URL to load; generate never connects.
        run: npx prisma generate
        env:
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Stub required env vars so the build succeeds in CI without real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          CRON_SECRET: placeholder
          NEXT_PUBLIC_SENTRY_DSN: ""
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
