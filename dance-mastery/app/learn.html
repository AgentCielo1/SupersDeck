<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance Mastery — Lesson</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%BA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0f14; --panel: #151924; --panel2: #1b2130; --line: #262e42;
    --text: #e8ebf2; --muted: #8b94ab; --accent: #f5a623; --accent2: #4cc2ff;
    --ok: #38c172; --warn: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px 8px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header a { color: var(--muted); text-decoration: none; font-size: .85rem; }
  h1 { font-size: 1.25rem; color: var(--accent); }
  #subtitle { color: var(--muted); font-size: .82rem; width: 100%; }
  #modes { display: flex; gap: 6px; padding: 0 16px 8px; }
  #modes button, .tempo {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 99px; padding: 6px 18px; cursor: pointer; font-size: .9rem;
  }
  #modes button.active { color: var(--text); border-color: var(--accent); background: #241d10; }
  main { flex: 1; display: flex; min-height: 0; }
  #viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; min-height: 0; width: 100%; touch-action: none; cursor: grab; }
  #viewer { min-height: 0; }
  #controls { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  #controls button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  #controls label { color: var(--muted); font-size: .8rem; display: flex; align-items: center; gap: 8px; }
  input[type=range] { accent-color: var(--accent); }
  #drillbar { display: none; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tempo.active { color: var(--text); border-color: var(--ok); background: #10281c; }
  #counts { display: flex; gap: 4px; }
  .ct { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--panel2); color: var(--muted); font-size: .8rem; border: 1px solid var(--line); }
  .ct.even { opacity: .75; }
  .ct.on { background: var(--accent); color: #14100a; font-weight: 700; }
  aside { width: 300px; border-left: 1px solid var(--line); padding: 14px 16px; overflow-y: auto; }
  aside h3 { color: var(--accent2); font-size: .78rem; text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; }
  aside h3:first-child { margin-top: 0; }
  aside h3.warn-h { color: var(--warn); }
  aside ol, aside ul { padding-left: 20px; display: grid; gap: 8px; }
  aside li { color: var(--text); font-size: .9rem; cursor: pointer; }
  aside li.warn { color: var(--muted); cursor: default; }
  aside li.hl { color: var(--accent); }
  .prereqs { color: var(--muted); font-size: .8rem; }
  @media (max-width: 700px) { main { flex-direction: column; } aside { width: 100%; border-left: none; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <a href="library.html">← library</a>
    <a href="index.html">today →</a>
    <a id="check-link" href="practice.html" style="color:var(--accent2)">✓ check with camera</a>
    <div id="subtitle"></div>
  </header>
  <div id="modes">
    <button data-mode="watch">Watch</button>
    <button data-mode="study">Study</button>
    <button data-mode="drill">Drill</button>
  </div>
  <main>
    <div id="viewer">
      <canvas id="stage"></canvas>
      <div id="controls">
        <button id="play">⏸</button>
        <label>speed <input id="speed" type="range" min="0.15" max="1.5" step="0.05" value="1"><span id="speedv">1.00×</span></label>
        <div id="drillbar">
          <button class="tempo active" data-tempo="0.5">50%</button>
          <button class="tempo" data-tempo="0.75">75%</button>
          <button class="tempo" data-tempo="1">100%</button>
          <div id="counts"></div>
          <label>loop <input id="loopA" type="range" min="0" max="1" step="0.01" value="0" style="width:70px">–<input id="loopB" type="range" min="0" max="1" step="0.01" value="1" style="width:70px"></label>
        </div>
      </div>
    </div>
    <aside id="checkpoints"></aside>
  </main>
  <script type="module" src="js/learn.js"></script>
</body>
</html>
