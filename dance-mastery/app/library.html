<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance Mastery — Move Library (simulation)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%BA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0f14; --panel: #151924; --panel2: #1b2130; --line: #262e42;
    --text: #e8ebf2; --muted: #8b94ab; --accent: #f5a623; --accent2: #4cc2ff; --ok: #38c172;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 18px 8px; }
  h1 { font-size: 1.15rem; letter-spacing: .5px; }
  h1 em { color: var(--accent); font-style: normal; }
  #counts { color: var(--muted); font-size: .8rem; }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 250px; overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; }
  .fam-group h3 { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent2); margin: 12px 6px 4px; }
  .mv { display: flex; justify-content: space-between; align-items: center; gap: 6px; width: 100%; text-align: left;
    background: none; border: 1px solid transparent; border-radius: 8px; color: var(--muted); padding: 5px 8px; cursor: pointer; font-size: .84rem; }
  .mv.anim { color: var(--text); }
  .mv em { font-style: normal; font-size: .68rem; color: var(--muted); }
  .mv.anim em { color: var(--ok); }
  .mv:hover { background: var(--panel); }
  .mv.sel { border-color: var(--accent); background: var(--panel); }
  #viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #stage { flex: 1; width: 100%; touch-action: none; cursor: grab; }
  #empty { position: absolute; inset: 0 0 64px 0; display: none; place-items: center; color: var(--muted); text-align: center; padding: 24px; font-size: .95rem; pointer-events: none; }
  #hud { position: absolute; top: 10px; left: 14px; right: 14px; pointer-events: none; }
  #move-name { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
  #move-meta { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .badge { font-size: .68rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); margin-right: 6px; }
  .badge.ok { color: var(--ok); border-color: #1f4d34; }
  .badge.queue { color: var(--accent); border-color: #5c4413; }
  #controls { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  #controls button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: .95rem; }
  #controls label { color: var(--muted); font-size: .8rem; display: flex; align-items: center; gap: 8px; }
  input[type=range] { accent-color: var(--accent); width: 160px; }
  @media (max-width: 640px) { aside { width: 168px; } }
</style>
</head>
<body>
  <header>
    <h1>MOVE <em>LIBRARY</em> — 3D instructor simulation</h1>
    <div id="counts"></div>
  </header>
  <main>
    <aside id="list"></aside>
    <div id="viewer">
      <div id="hud">
        <div id="move-name"></div>
        <div id="move-meta"></div>
      </div>
      <canvas id="stage"></canvas>
      <div id="empty">This move is in the Motion Factory queue (Doc 08).<br>
        Its clip arrives via the self-capture lane: phone rig → open-source reconstruction → Blender cleanup → GLB.<br>
        Every animated move you see here was produced in the $0 procedural lane.</div>
      <div id="controls">
        <button id="play" title="play/pause">⏸</button>
        <label>speed <input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="1"><span id="speedv">1.00×</span></label>
        <button id="orbit" title="toggle auto-orbit">🔄 orbit</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/library.js"></script>
</body>
</html>
