<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance Mastery — Clip Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%BA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0f14; --panel: #151924; --panel2: #1b2130; --line: #262e42;
    --text: #e8ebf2; --muted: #8b94ab; --accent: #f5a623; --accent2: #4cc2ff;
    --ok: #38c172; --warn: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 16px; max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 1.15rem; color: var(--accent); }
  header a { color: var(--muted); text-decoration: none; font-size: .85rem; }
  #move-name { color: var(--accent2); font-weight: 700; }
  #meta { color: var(--muted); font-size: .78rem; width: 100%; }
  #drop {
    border: 2px dashed var(--line); border-radius: 14px; padding: 60px 24px;
    text-align: center; color: var(--muted); margin-top: 30px;
  }
  #drop input { display: block; margin: 14px auto 0; color: var(--muted); }
  #content { display: none; grid-template-columns: 320px 1fr; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .score { font-size: 4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .score.good { color: var(--ok); } .score.mid { color: var(--accent); } .score.bad { color: var(--warn); }
  .verdict-line { font-weight: 600; margin: 2px 0 8px; }
  .muted { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  .chip { background: var(--panel2); color: var(--warn); border: 1px solid #5c2020; border-radius: 99px; padding: 4px 12px; cursor: pointer; font-size: .8rem; margin: 8px 6px 0 0; }
  #chart-wrap h3, #replay-wrap h3 { color: var(--accent2); font-size: .75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  #chart { width: 100%; height: 140px; cursor: crosshair; }
  #replay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  #user-stage, #ref-stage { width: 100%; height: 300px; border: 1px solid var(--line); border-radius: 10px; }
  #controls { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  #controls button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  #controls label { color: var(--muted); font-size: .8rem; display: flex; gap: 8px; align-items: center; }
  input[type=range] { accent-color: var(--accent); }
  @media (max-width: 820px) { #content { grid-template-columns: 1fr; } #replay-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <h1>CLIP <em style="color:var(--accent2);font-style:normal">REVIEW</em></h1>
    <span id="move-name"></span>
    <a href="practice.html">← practice</a>
    <a href="index.html">today →</a>
    <div id="meta"></div>
  </header>

  <div id="drop">
    <p><strong>Drop a report.json here</strong> (from <code>tools/analyze.sh &lt;video&gt; &lt;moveId&gt;</code>)</p>
    <p class="muted">Record any clip — power moves included — analyze it offline with the heavy model, then read the verdict here.</p>
    <input id="file" type="file" accept=".json,application/json">
  </div>

  <div id="content">
    <div class="card" id="verdict"></div>
    <div>
      <div class="card" id="chart-wrap">
        <h3>Deviation vs reference over the clip — click to scrub</h3>
        <canvas id="chart"></canvas>
      </div>
      <div class="card" id="replay-wrap" style="margin-top:14px">
        <h3>Your skeleton vs the reference</h3>
        <div id="replay-grid">
          <canvas id="user-stage"></canvas>
          <canvas id="ref-stage"></canvas>
        </div>
        <div id="controls">
          <button id="play">⏸</button>
          <label>speed <input id="speed" type="range" min="0.15" max="1" step="0.05" value="0.5"><span id="speedv">0.50×</span></label>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/review.js"></script>
</body>
</html>
